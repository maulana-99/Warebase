<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Vite build files have a content hash in their name, so browsers may keep them for a year.
    <Directory /var/www/html/public/build/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # Compress text responses (HTML, CSS, JS, JSON, SVG).
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/csv text/javascript application/javascript application/json image/svg+xml
    </IfModule>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
