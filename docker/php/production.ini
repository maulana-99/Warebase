; Production PHP settings for the Warebase image.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M
upload_max_filesize = 2M
post_max_size = 8M

; Mitigation for CVE-2026-115560 (no PHP fix yet). Laravel does not use PHP's native sessions.
session.upload_progress.enabled = 0

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
